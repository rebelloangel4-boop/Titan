[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "titan-ai-private"
version = "0.3.0"
requires-python = ">=3.12"
description = "Private mission orchestration and independently evaluated AI debate alpha"
dependencies = []
[tool.setuptools.package-data]
titan = ["web/*"]
[tool.setuptools.packages.find]
include = ["titan*"]
